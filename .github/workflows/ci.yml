name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  test:
    name: Testes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Dar permissão ao Gradle Wrapper
        run: chmod +x gradlew

      - name: Executar testes
        run: ./gradlew test


  sonarqube:
    name: Análise de qualidade (SonarQube)
    runs-on: ubuntu-latest

    services:
      sonarqube:
        image: sonarqube:lts-community
        ports:
          - 9000:9000

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Dar permissão ao Gradle Wrapper
        run: chmod +x gradlew

      - name: Esperar o SonarQube ficar pronto
        run: |
          echo "Aguardando SonarQube..."

          until curl -s http://localhost:9000/api/system/status | grep -q '"status":"UP"'; do
            echo "SonarQube ainda não está pronto..."
            sleep 5
          done

          echo "SonarQube está pronto!"

      - name: Executar testes
        run: ./gradlew test

      - name: Rodar análise do SonarQube
        run: |
          ./gradlew sonar \
            -Dsonar.host.url=http://localhost:9000 \
            -Dsonar.login=admin \
            -Dsonar.password=admin \
            -Dsonar.projectKey=devops-task-api


  security:
    name: Segurança (Trivy)
    # só roda se os testes passarem
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      # 1) Escaneia o repositório: secrets vazados + problemas no Dockerfile
      # Dica: depois de tudo funcionando, troque a tag v0.36.0 pelo SHA
      # completo do commit dessa release (pin por SHA).
      - name: Trivy - repositório (secrets, misconfig, dependências)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,secret,misconfig'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'

      # 2) Builda a imagem e escaneia (SO base + JARs da aplicação)
      - name: Build da imagem Docker
        run: docker build -t devops-task-api:${{ github.sha }} .

      - name: Trivy - imagem Docker
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'devops-task-api:${{ github.sha }}'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'


  publish:
    name: Build e publicação da imagem
    needs: [test, sonarqube, security]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-task-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-task-api:${{ github.sha }}